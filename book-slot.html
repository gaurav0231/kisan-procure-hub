<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Arrival Slot • ई-उपार्जन Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <span class="brand-icon">🌾</span>
        <div>
          <div class="brand-title">मंडी Saathi</div>
          <div class="brand-subtitle">Smart Agri-Procurement</div>
        </div>
      </a>
      <ul class="nav-links" id="navLinks"></ul>
    </div>
  </nav>

  <main class="main-content">
    <div class="card" style="max-width: 680px; margin: 20px auto;">
      <h2 class="card-title">📅 Reserve Mandi Gate Arrival Slot</h2>
      <p class="card-desc">Lock an entry token pass to avoid waiting in multi-day tractor queues.</p>

      <form id="bookingForm">
        <div class="form-row">
          <div class="form-group">
            <label>Farmer Name *</label>
            <input type="text" id="farmerName" placeholder="e.g. Gaurav Singh" required />
          </div>
          <div class="form-group">
            <label>Mobile Number (Linked to Aadhaar) *</label>
            <input type="tel" id="farmerPhone" placeholder="10-digit mobile number" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Procurement Yard Center *</label>
            <select id="centerSelect" required>
              <option value="Baraut Central Mandi Yard">Baraut Central Mandi Yard (Yard #1)</option>
              <option value="Baghpat APMC Main Sub-Yard">Baghpat APMC Main Sub-Yard</option>
              <option value="Khekra Grain Mandi Complex">Khekra Grain Mandi Complex</option>
              <option value="Chhaprauli Farmer Hub">Chhaprauli Farmer Hub</option>
            </select>
          </div>
          <div class="form-group">
            <label>Commodity Crop *</label>
            <select id="cropType" required>
              <option value="Wheat (Sharbati)">Wheat (Sharbati) - MSP ₹2,425/Qtl</option>
              <option value="Mustard (RM)">Mustard (Rabi RM) - MSP ₹5,950/Qtl</option>
              <option value="Gram (Chana)">Gram (Chana) - MSP ₹5,650/Qtl</option>
              <option value="Barley (Jau)">Barley - MSP ₹1,980/Qtl</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Estimated Quantity (Quintals) *</label>
            <input type="number" id="cropQty" min="5" max="500" placeholder="e.g. 40" required />
          </div>
          <div class="form-group">
            <label>Tractor / Vehicle Plate No. *</label>
            <input type="text" id="vehicleNo" placeholder="e.g. UP-17-AT-4011" required />
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label>Select Arrival Slot Window (1-Hour Pass)</label>
          <div class="slot-grid">
            <label>
              <input type="radio" name="arrivalSlot" value="08:00 AM - 09:00 AM" class="slot-radio" />
              <div class="slot-box">
                <span class="slot-time">08:00 - 09:00 AM</span>
                <span class="slot-count">12 / 20 Slots Left</span>
              </div>
            </label>
            <label>
              <input type="radio" name="arrivalSlot" value="09:00 AM - 10:00 AM" class="slot-radio" checked />
              <div class="slot-box">
                <span class="slot-time">09:00 - 10:00 AM</span>
                <span class="slot-count">8 / 20 Slots Left</span>
              </div>
            </label>
            <label>
              <input type="radio" name="arrivalSlot" value="10:00 AM - 11:00 AM" class="slot-radio" />
              <div class="slot-box">
                <span class="slot-time">10:00 - 11:00 AM</span>
                <span class="slot-count">4 / 20 Slots Left</span>
              </div>
            </label>
            <label>
              <input type="radio" name="arrivalSlot" value="11:00 AM - 12:00 PM" class="slot-radio" />
              <div class="slot-box">
                <span class="slot-time">11:00 - 12:00 PM</span>
                <span class="slot-count">14 / 20 Slots Left</span>
              </div>
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Generate Mandi Gate Pass ➔</button>
      </form>
    </div>
  </main>

  <footer class="portal-footer">
    <div class="footer-inner">
      <p>Department of Agricultural Logistics & Mandi Affairs • Unified National Procurement Network</p>
      <span>© 2026</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
