<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Kisan Mandi Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <span class="brand-icon">🌾</span>
        <div>
          <div class="brand-title">मंडी Saathi</div>
          <div class="brand-subtitle">Smart Agri-Procurement</div>
        </div>
      </a>
      <ul class="nav-links" id="navLinks"></ul>
    </div>
  </nav>

  <main class="main-content" style="max-width: 480px;">
    <div class="card" style="max-width: 440px; margin: 40px auto;">
  
  <!-- Role Switcher Tabs -->
  <div class="tab-container">
    <button type="button" class="tab-btn active" id="roleFarmerBtn" onclick="switchRole('FARMER')">👨‍🌾 Farmer Login</button>
    <button type="button" class="tab-btn" id="roleOperatorBtn" onclick="switchRole('OPERATOR')">🏢 Mandi Operator</button>
  </div>

  <!-- Header Text -->
  <h2 class="card-title" id="loginHeaderTitle">Farmer Portal Sign In</h2>
  <p class="card-desc" id="loginHeaderSubtitle">Access slot reservation, token slips, and live payment DBT tracking.</p>

  <!-- Login Form -->
  <form id="authForm">
    
    <!-- Primary Identifier -->
    <div class="form-group" style="margin-bottom: 16px;">
      <label id="identifierLabel">Mobile Number *</label>
      <input type="text" id="authIdentifier" placeholder="10-digit registered number" required />
    </div>

    <!-- Password / PIN -->
    <div class="form-group" style="margin-bottom: 16px;">
      <label>Password / Access PIN *</label>
      <input type="password" id="authPassword" placeholder="Enter password or 4-digit PIN" required />
    </div>

    <!-- Operator-Only Field (Hidden for Farmers by default) -->
    <div class="form-group" id="operatorFieldGroup" style="display: none; margin-bottom: 16px;">
      <label>Mandi Yard Station ID *</label>
      <input type="text" id="authMandiStation" placeholder="e.g. BARAUT-GATE-01" />
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary">Sign In to Portal ➔</button>

  </form>
</div>

      <div style="margin-top: 20px; padding: 12px; background: #f8fafc; border-radius: 8px; border: 1px dashed var(--border);">
        <span style="font-size: 0.75rem; font-weight: bold; color: var(--text-muted); display: block; margin-bottom: 8px;">
          ⚡ QUICK DEMO CREDENTIALS:
        </span>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn btn-outline" style="font-size: 0.75rem; flex: 1;" onclick="fillDemo('farmer')">Demo Farmer</button>
          <button type="button" class="btn btn-outline" style="font-size: 0.75rem; flex: 1;" onclick="fillDemo('operator')">Demo Operator</button>
        </div>
      </div>
    </div>
  </main>

  <footer>Department of Agricultural Logistics & Farmers Welfare • © 2026</footer>
  <script src="script.js"></script>
  <script>
    function fillDemo(role) {
      if (role === 'farmer') {
        document.getElementById('roleFarmerBtn').click();
        document.getElementById('authIdentifier').value = "9876543210";
        document.getElementById('authPassword').value = "1234";
      } else {
        document.getElementById('roleOperatorBtn').click();
        document.getElementById('authIdentifier').value = "operator@mandi.gov.in";
        document.getElementById('authPassword').value = "operator123";
        document.getElementById('authMandiStation').value = "BARAUT-GATE-01";
      }
    }
  </script>
</body>
</html>
